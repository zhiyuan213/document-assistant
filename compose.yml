services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dengke
      MYSQL_USER: dengke
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    ports: ['127.0.0.1:3306:3306']
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    ports: ['127.0.0.1:8080:8080']
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dengke?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      PDF_BILLING_ENABLED: ${PDF_BILLING_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      PDF_PAYMENT_PROVIDER: ${PDF_PAYMENT_PROVIDER:-virtual}
      WECHAT_VIRTUAL_OFFER_ID: ${WECHAT_VIRTUAL_OFFER_ID:-}
      WECHAT_VIRTUAL_APP_KEY: ${WECHAT_VIRTUAL_APP_KEY:-}
      WECHAT_VIRTUAL_SANDBOX_APP_KEY: ${WECHAT_VIRTUAL_SANDBOX_APP_KEY:-}
      WECHAT_VIRTUAL_NOTIFY_MODE: ${WECHAT_VIRTUAL_NOTIFY_MODE:-cloudrun}
      WECHAT_VIRTUAL_ENV: ${WECHAT_VIRTUAL_ENV:-0}
      WECHAT_VIRTUAL_MONTHLY_PRODUCT_ID: ${WECHAT_VIRTUAL_MONTHLY_PRODUCT_ID:-ai_monthly}
      WECHAT_VIRTUAL_TOPUP_PRODUCT_ID: ${WECHAT_VIRTUAL_TOPUP_PRODUCT_ID:-ai_topup}
      WECHAT_VIRTUAL_NOTIFY_TOKEN: ${WECHAT_VIRTUAL_NOTIFY_TOKEN:-}
      WECHAT_VIRTUAL_ENCODING_AES_KEY: ${WECHAT_VIRTUAL_ENCODING_AES_KEY:-}
      PDF_MONTHLY_PRICE_FEN: ${PDF_MONTHLY_PRICE_FEN:-990}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      PDF_AI_TEST_MODE: ${PDF_AI_TEST_MODE:-false}
      PDF_AI_MONTHLY_TOKEN_CREDITS: ${PDF_AI_MONTHLY_TOKEN_CREDITS:-2000000}
      PDF_AI_DAILY_REQUEST_LIMIT: ${PDF_AI_DAILY_REQUEST_LIMIT:-50}
      PDF_AI_MAX_PAGES: ${PDF_AI_MAX_PAGES:-30}
      PDF_AI_MAX_SCAN_PAGES: ${PDF_AI_MAX_SCAN_PAGES:-5}
      PDF_AI_MAX_INPUT_CHARS: ${PDF_AI_MAX_INPUT_CHARS:-15000}
      PDF_AI_MAX_OUTPUT_TOKENS: ${PDF_AI_MAX_OUTPUT_TOKENS:-1500}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
    volumes: ['files:/app/data/pdf-temp']
    depends_on:
      mysql: { condition: service_healthy }
volumes:
  mysql-data:
  files:
