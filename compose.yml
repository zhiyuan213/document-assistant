services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dengke
      MYSQL_USER: dengke
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    ports: ['127.0.0.1:3306:3306']
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    ports: ['127.0.0.1:8080:8080']
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dengke?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      PDF_BILLING_ENABLED: ${PDF_BILLING_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
    volumes: ['files:/app/data/pdf-temp']
    depends_on:
      mysql: { condition: service_healthy }
volumes:
  mysql-data:
  files:
